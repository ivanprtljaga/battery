[versions]
# Resolved against live Maven metadata rather than guessed, same rule as
# ../android/gradle/libs.versions.toml.
kotlin = "2.4.10"                # matches android/ exactly. `core` is compiled by
                                 # both builds, so a drift here would mean the same
                                 # source compiled two ways.
kotlinxSerialization = "1.11.0"  # matches android/ — required, not optional: this
                                 # alias is resolved by ../android/core/build.gradle.kts
                                 # when this build compiles that module.
compose = "1.12.0"               # Compose Multiplatform, newest stable, verified
                                 # building and running against Kotlin 2.4.10.
jna = "5.19.1"                   # Win32 calls the JDK does not expose. Phase 2
                                 # needs Shell_NotifyIconGetRect; Phase 4 needs
                                 # ITaskbarList3 and the WinRT toast surface.

[libraries]
# Compose Multiplatform for the desktop. Declared by coordinate rather than via
# the plugin's `compose.desktop.currentOS` helper: that accessor is gone in
# 1.12, and `compose.material3` is deprecated in favour of direct coordinates.
compose-desktop = { group = "org.jetbrains.compose.desktop", name = "desktop-jvm", version.ref = "compose" }

kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

# `jna` is the FFI runtime; `jna-platform` is the generated Win32 binding layer
# on top of it — User32, Kernel32 and the WinDef structs. Both are needed, and
# their versions must match.
jna = { group = "net.java.dev.jna", name = "jna", version.ref = "jna" }
jna-platform = { group = "net.java.dev.jna", name = "jna-platform", version.ref = "jna" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose = { id = "org.jetbrains.compose", version.ref = "compose" }
