# Copy to winget-pkgs, replacing <VERSION> and <SHA256>. See README.md.
#
# The SHA256 is printed by windows-release.yml and repeated in the release body.
PackageIdentifier: allthingsclaude.Battery
PackageVersion: <VERSION>
InstallerType: wix
# Per-user, matching `perUserInstall = true` in the Gradle build: a tray app
# that reads one person's Claude Code credential has no business installing for
# every account on the machine, and this way it never prompts for an admin.
Scope: user
InstallModes:
- interactive
- silent
- silentWithProgress
UpgradeBehavior: install
# No ProductCode on purpose. winget's field means the MSI's ProductCode, and
# jpackage generates a fresh one per build — pinning it would make winget stop
# recognising the package the first time it is rebuilt. The stable identifier is
# the *UpgradeCode* (`upgradeUuid` in windows/app/build.gradle.kts), which winget
# has no field for and does not need: Windows Installer uses it to know that a
# new version replaces the old one rather than sitting beside it.
MinimumOSVersion: 10.0.0.0
Installers:
- Architecture: x64
  InstallerUrl: https://github.com/allthingsclaude/battery/releases/download/windows-v<VERSION>/battery-<VERSION>.msi
  InstallerSha256: <SHA256>
ManifestType: installer
ManifestVersion: 1.6.0
