name: Windows CI

# Nothing else runs these tests. `ci.yml` builds the macOS app and
# `android-ci.yml` the Android one; neither looks at `windows/`, and until this
# existed the only workflow that ran `gradlew test` here was the release — on a
# `windows-v*` tag. So the suite guarded a release and nothing else, and a broken
# commit stayed green until somebody cut a version.
on:
  push:
    # Feature branches included, following `android-ci.yml` and for the reason
    # it gives: `ci.yml` fires only on main and on pull requests against it, so
    # a long-lived branch gets no CI until the moment it is proposed for merge —
    # the worst possible time to discover the runner cannot resolve the borrowed
    # `core`. This port was built on `windows/desktop-port` and went through CI
    # exactly as many times as the Android one did: zero.
    branches: [main, 'windows/**']
    paths: &windows-paths
      - 'windows/**'
      # `core` is the Android tree's module, borrowed in place. A change there
      # compiles into this build too, so it has to trigger this job — that is
      # the cost of the borrow, and it is cheaper than finding out at release.
      - 'android/core/**'
      - '.github/workflows/windows-ci.yml'
  pull_request:
    branches: [main]
    paths: *windows-paths

jobs:
  test:
    # jpackage cannot cross-build and Skia is host-specific, so the Windows app
    # is built on Windows or not at all.
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          # The version the release builds with, so this job fails on anything
          # the release would fail on rather than on a different JDK's opinion.
          java-version: '21'

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      # `:app:test` alone would not prove the borrow still resolves. `test`
      # covers `:core:test` as well, which runs the shared golden fixtures from
      # this build — the wiring the whole `windows/` tree depends on.
      - name: Test
        working-directory: windows
        run: ./gradlew.bat test

      # The tests do not compile the packaging. Two things this session broke
      # were invisible to them: the `application` plugin colliding with
      # `compose.desktop.application`'s own `run` task, and a trimmed module
      # list that dropped `jdk.localedata`. `createDistributable` runs jpackage
      # without the WiX step, so it catches both in about a minute.
      - name: Build the app image
        working-directory: windows
        run: ./gradlew.bat :app:createDistributable

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-test-reports
          path: windows/app/build/reports/tests/
          retention-days: 7
